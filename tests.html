<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests : en cours…</title>
<style>
  :root { --fond: #fbf8f3; --texte: #2b2622; --doux: #6f665e; --trait: #e4dcd0; --ok: #1f7a3d; --echec: #b3261e; --fond-echec: #fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #1d1b19; --texte: #ece6dd; --doux: #a59c92; --trait: #3a3531; --ok: #6fcf8b; --echec: #ff8a80; --fond-echec: #3a1f1d; }
  }
  body { margin: 0; padding: 24px 16px 48px; background: var(--fond); color: var(--texte); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 28px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--trait); }
  h2 small { font-weight: normal; color: var(--doux); }
  .bilan { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .bilan.ok { color: var(--ok); }
  .bilan.echec { color: var(--echec); }
  .note { color: var(--doux); margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  li.ok { color: var(--ok); }
  li.echec { color: var(--echec); background: var(--fond-echec); font-weight: 600; }
  li .message { display: block; font-weight: normal; font-family: Consolas, "Courier New", monospace; font-size: 13px; padding-left: 22px; }
</style>
</head>
<body>
<main>
  <h1>Dessin du jour — tests de la logique</h1>
  <p id="bilan" class="bilan">Tests en cours…</p>
  <p class="note">Cette page charge les données réelles (exercices, idées, guide) et logique.js, puis vérifie leur comportement. Rien n’est enregistré.</p>
  <div id="resultats"></div>
</main>

<script src="donnees/exercices-semaine.js"></script>
<script src="donnees/exercices-weekend.js"></script>
<script src="donnees/idees.js"></script>
<script src="donnees/guide-1.js"></script>
<script src="donnees/guide-2.js"></script>
<script src="donnees/guide-3.js"></script>
<script src="logique.js"></script>
<script>
(function () {
  "use strict";

  var DDJ = window.DDJ = window.DDJ || {};
  var L = DDJ.logique || {};

  /* ================================================================== */
  /* Mini-harnais                                                        */
  /* ================================================================== */

  var resultats = [];
  var groupeCourant = "";

  function groupe(nom) {
    groupeCourant = nom;
  }

  /* Chaque test est isolé : une exception = un échec, les autres continuent. */
  function test(nom, fn) {
    var r = { groupe: groupeCourant, nom: nom, ok: true, message: "" };
    try {
      fn();
    } catch (e) {
      r.ok = false;
      r.message = (e && e.message) ? String(e.message) : String(e);
    }
    resultats.push(r);
  }

  function stable(v) {
    var cles, morceaux, i;
    if (v === null || typeof v !== "object") {
      return String(JSON.stringify(v));
    }
    morceaux = [];
    if (Object.prototype.toString.call(v) === "[object Array]") {
      for (i = 0; i < v.length; i++) {
        morceaux.push(stable(v[i]));
      }
      return "[" + morceaux.join(",") + "]";
    }
    cles = Object.keys(v).sort();
    for (i = 0; i < cles.length; i++) {
      morceaux.push(JSON.stringify(cles[i]) + ":" + stable(v[cles[i]]));
    }
    return "{" + morceaux.join(",") + "}";
  }

  function verifier(condition, message) {
    if (!condition) {
      throw new Error(message || "la condition attendue est fausse");
    }
  }

  function egal(obtenu, attendu, message) {
    if (obtenu !== attendu) {
      throw new Error((message ? message + " : " : "") + "attendu " + stable(attendu) + ", obtenu " + stable(obtenu));
    }
  }

  /* Égalité en profondeur (ordre des propriétés indifférent). */
  function pareil(obtenu, attendu, message) {
    var a = stable(obtenu);
    var b = stable(attendu);
    if (a !== b) {
      throw new Error((message ? message + " : " : "") + "attendu " + b + ", obtenu " + a);
    }
  }

  function proche(obtenu, attendu, message) {
    if (typeof obtenu !== "number" || Math.abs(obtenu - attendu) > 1e-12) {
      throw new Error((message ? message + " : " : "") + "attendu " + attendu + ", obtenu " + obtenu);
    }
  }

  /* ================================================================== */
  /* Aides pour les tests                                                */
  /* ================================================================== */

  var ATTENDUS = {
    1: { cle: "lignes", jour: "Lundi", nom: "Lignes et échauffement", prefixe: "lun-" },
    2: { cle: "objets", jour: "Mardi", nom: "Objets du quotidien", prefixe: "mar-" },
    3: { cle: "personnages", jour: "Mercredi", nom: "Personnages et gestes", prefixe: "mer-" },
    4: { cle: "espaces", jour: "Jeudi", nom: "Espaces et perspective", prefixe: "jeu-" },
    5: { cle: "nature", jour: "Vendredi", nom: "Nature", prefixe: "ven-" },
    6: { cle: "imagination", jour: "Samedi", nom: "Imagination", prefixe: "sam-" },
    0: { cle: "libre", jour: "Dimanche", nom: "Libre", prefixe: "dim-" }
  };
  var ORDRE_JOURS = [1, 2, 3, 4, 5, 6, 0];
  var JOURS_BANQUE = [1, 2, 3, 4, 5, 0]; /* tous sauf le samedi */

  /* Clé du jour de semaine « js » (0 = dimanche) dans la semaine d’index donné. */
  function cleDe(semaine, js) {
    return L.ajouterJours("2024-01-01", semaine * 7 + ((js + 6) % 7));
  }

  function exo(cle, tirage) {
    var e = L.exerciceDuJour(cle, tirage);
    if (!e) {
      throw new Error("exerciceDuJour(" + cle + ", " + tirage + ") a renvoyé " + stable(e));
    }
    return e;
  }

  function themeReel(js) {
    var t = DDJ.themes ? DDJ.themes[js] : null;
    if (!t || typeof t !== "object") {
      throw new Error("le thème du jour " + js + " (" + ATTENDUS[js].jour + ") est absent des données");
    }
    if (Object.prototype.toString.call(t.exercices) !== "[object Array]" || t.exercices.length === 0) {
      throw new Error("le thème « " + ATTENDUS[js].jour + " » n’a pas d’exercices");
    }
    return t;
  }

  function generateurReel() {
    var g = DDJ.generateur;
    if (!g || !g.sujets || !g.contraintes || !g.sujets.length || !g.contraintes.length) {
      throw new Error("DDJ.generateur est absent ou vide");
    }
    return g;
  }

  /* Remplace temporairement les données, le temps d’une fonction. */
  function avecDonnees(themes, generateur, fn) {
    var themesAvant = DDJ.themes;
    var generateurAvant = DDJ.generateur;
    DDJ.themes = themes;
    DDJ.generateur = generateur;
    try {
      return fn();
    } finally {
      DDJ.themes = themesAvant;
      DDJ.generateur = generateurAvant;
    }
  }

  function exerciceFactice(prefixe, i) {
    return {
      id: prefixe + (i < 9 ? "0" : "") + (i + 1),
      titre: "Exercice " + (i + 1),
      consigne: "Dessine quelque chose de simple.",
      etapes: ["5 min : observe.", "5 min : esquisse.", "5 min : précise."],
      materiel: "Crayon et papier",
      siBloque: "Fais plus simple.",
      duree: 15
    };
  }

  function themesFactices(n) {
    var themes = {};
    var js, i, liste;
    for (js = 0; js < 7; js++) {
      liste = [];
      for (i = 0; i < n; i++) {
        liste.push(exerciceFactice(ATTENDUS[js].prefixe, i));
      }
      themes[js] = {
        cle: ATTENDUS[js].cle,
        jour: ATTENDUS[js].jour,
        nom: ATTENDUS[js].nom,
        description: "Thème factice.",
        exercices: liste
      };
    }
    return themes;
  }

  function generateurFactice() {
    return {
      sujets: ["un phare", "une théière", "un chat", "un vélo"],
      contraintes: ["en pleine tempête", "sous la mer", "la nuit", "vu de très loin"]
    };
  }

  /* Objet « jours » à partir d’une liste de clés. */
  function jours(liste) {
    var o = {};
    var i;
    for (i = 0; i < liste.length; i++) {
      o[liste[i]] = {
        exerciceId: "lun-01", titre: "Test", themeNom: "Lignes et échauffement",
        duree: 20, ressenti: null, faitLe: liste[i] + "T10:00:00.000Z"
      };
    }
    return o;
  }

  /* Toutes les clés de debut à fin incluses. */
  function plage(debut, fin) {
    var liste = [];
    var c = debut;
    var garde = 0;
    while (c !== null && c <= fin && garde < 5000) {
      liste.push(c);
      c = L.ajouterJours(c, 1);
      garde++;
    }
    return liste;
  }

  function sans(liste, exclus) {
    var r = [];
    var i;
    for (i = 0; i < liste.length; i++) {
      if (exclus.indexOf(liste[i]) === -1) {
        r.push(liste[i]);
      }
    }
    return r;
  }

  function seuils(paliers) {
    var r = [];
    var i;
    for (i = 0; i < paliers.length; i++) {
      r.push(paliers[i].seuil);
    }
    return r;
  }

  function serie(listeFaits, aujourdHui) {
    return L.calculerSerie(jours(listeFaits), aujourdHui);
  }

  function historique(listeFaits, aujourdHui) {
    return L.jokersHistorique(jours(listeFaits), aujourdHui);
  }

  /* ================================================================== */
  groupe("Dates");
  /* ================================================================== */

  test("cleDate utilise la date locale, même tard le soir", function () {
    egal(L.cleDate(new Date(2026, 0, 5, 23, 59, 59)), "2026-01-05");
  });

  test("cleDate juste après minuit donne bien le nouveau jour", function () {
    egal(L.cleDate(new Date(2026, 2, 1, 0, 0, 1)), "2026-03-01");
  });

  test("cleDate complète les mois et jours sur 2 chiffres", function () {
    egal(L.cleDate(new Date(2026, 8, 9, 12, 0, 0)), "2026-09-09");
  });

  test("cleDate renvoie null pour une date invalide", function () {
    egal(L.cleDate(new Date(NaN)), null);
    egal(L.cleDate("2026-01-05"), null);
    egal(L.cleDate(null), null);
  });

  test("aujourdHui renvoie la clé valide du jour courant", function () {
    var avant = L.cleDate(new Date());
    var cle = L.aujourdHui();
    var apres = L.cleDate(new Date());
    verifier(L.estCleValide(cle), "clé invalide : " + cle);
    verifier(cle === avant || cle === apres, "clé inattendue : " + cle);
  });

  test("dateDepuisCle donne un objet Date local à midi", function () {
    var d = L.dateDepuisCle("2026-11-16");
    verifier(d instanceof Date, "ce n’est pas un objet Date");
    egal(d.getFullYear(), 2026);
    egal(d.getMonth(), 10);
    egal(d.getDate(), 16);
    egal(d.getHours(), 12);
    egal(d.getMinutes(), 0);
  });

  test("dateDepuisCle renvoie null pour une clé invalide", function () {
    egal(L.dateDepuisCle("2026-02-30"), null);
    egal(L.dateDepuisCle("demain"), null);
    egal(L.dateDepuisCle(undefined), null);
  });

  test("cleDate(dateDepuisCle(cle)) redonne la clé pour chaque jour de 2026", function () {
    var liste = plage("2026-01-01", "2026-12-31");
    var i;
    egal(liste.length, 365, "nombre de jours en 2026");
    for (i = 0; i < liste.length; i++) {
      egal(L.cleDate(L.dateDepuisCle(liste[i])), liste[i]);
    }
  });

  test("ajouterJours passe correctement les fins de mois et d’année", function () {
    egal(L.ajouterJours("2026-01-31", 1), "2026-02-01");
    egal(L.ajouterJours("2026-04-30", 1), "2026-05-01");
    egal(L.ajouterJours("2026-12-31", 1), "2027-01-01");
    egal(L.ajouterJours("2027-01-01", -1), "2026-12-31");
    egal(L.ajouterJours("2026-03-01", -1), "2026-02-28");
  });

  test("ajouterJours gère les années bissextiles", function () {
    egal(L.ajouterJours("2028-02-28", 1), "2028-02-29");
    egal(L.ajouterJours("2028-02-29", 1), "2028-03-01");
    egal(L.ajouterJours("2028-03-01", -1), "2028-02-29");
    egal(L.ajouterJours("2027-02-28", 1), "2027-03-01");
  });

  test("ajouterJours traverse le passage à l’heure d’été (fin mars)", function () {
    egal(L.ajouterJours("2026-03-28", 1), "2026-03-29");
    egal(L.ajouterJours("2026-03-29", 1), "2026-03-30");
    egal(L.ajouterJours("2026-03-30", -1), "2026-03-29");
    egal(L.ajouterJours("2026-03-29", -1), "2026-03-28");
    egal(L.ecartJours("2026-03-28", "2026-03-30"), 2);
  });

  test("ajouterJours traverse le passage à l’heure d’hiver (fin octobre)", function () {
    egal(L.ajouterJours("2026-10-24", 1), "2026-10-25");
    egal(L.ajouterJours("2026-10-25", 1), "2026-10-26");
    egal(L.ajouterJours("2026-10-26", -1), "2026-10-25");
    egal(L.ajouterJours("2026-10-25", -1), "2026-10-24");
    egal(L.ecartJours("2026-10-24", "2026-10-26"), 2);
  });

  test("ajouterJours accepte 0, les grands décalages et les décalages négatifs", function () {
    egal(L.ajouterJours("2026-07-14", 0), "2026-07-14");
    egal(L.ajouterJours("2026-01-01", 365), "2027-01-01");
    egal(L.ajouterJours("2026-03-01", -365), "2025-03-01");
    egal(L.ajouterJours("2028-01-01", 366), "2029-01-01");
  });

  test("avancer d’un jour 365 fois depuis le 1er janvier 2026 mène au 1er janvier 2027", function () {
    var c = "2026-01-01";
    var i, suivant;
    for (i = 0; i < 365; i++) {
      suivant = L.ajouterJours(c, 1);
      verifier(L.estCleValide(suivant), "clé invalide après " + c);
      verifier(suivant > c, "la clé n’avance pas après " + c);
      egal(L.ecartJours(c, suivant), 1);
      c = suivant;
    }
    egal(c, "2027-01-01");
  });

  test("ajouterJours renvoie null pour une clé invalide", function () {
    egal(L.ajouterJours("2026-13-01", 1), null);
    egal(L.ajouterJours("", 1), null);
    egal(L.ajouterJours(null, 1), null);
  });

  test("jourSemaine : 0 pour dimanche, 6 pour samedi", function () {
    egal(L.jourSemaine("2024-01-01"), 1, "lundi 1er janvier 2024");
    egal(L.jourSemaine("2026-11-16"), 1, "lundi 16 novembre 2026");
    egal(L.jourSemaine("2026-03-15"), 0, "dimanche 15 mars 2026");
    egal(L.jourSemaine("2026-03-14"), 6, "samedi 14 mars 2026");
    egal(L.jourSemaine("2028-02-29"), 2, "mardi 29 février 2028");
    egal(L.jourSemaine("pas une date"), null);
  });

  test("jourSemaine est d’accord avec Date.getDay pour chaque jour de 2026", function () {
    var liste = plage("2026-01-01", "2026-12-31");
    var i;
    for (i = 0; i < liste.length; i++) {
      egal(L.jourSemaine(liste[i]), L.dateDepuisCle(liste[i]).getDay(), liste[i]);
    }
  });

  test("cleLundi un dimanche renvoie le lundi précédent (semaine lundi-dimanche)", function () {
    egal(L.cleLundi("2026-03-15"), "2026-03-09");
  });

  test("cleLundi un lundi renvoie le jour même, et en milieu de semaine le lundi", function () {
    egal(L.cleLundi("2026-03-09"), "2026-03-09");
    egal(L.cleLundi("2026-03-11"), "2026-03-09");
    egal(L.cleLundi("2026-03-14"), "2026-03-09");
  });

  test("cleLundi traverse les limites de mois et d’année", function () {
    egal(L.cleLundi("2026-03-01"), "2026-02-23");
    egal(L.cleLundi("2027-01-01"), "2026-12-28");
    egal(L.cleLundi("mardi"), null);
  });

  test("ecartJours compte les jours de A vers B, avec le signe", function () {
    egal(L.ecartJours("2026-03-09", "2026-03-09"), 0);
    egal(L.ecartJours("2026-03-09", "2026-03-16"), 7);
    egal(L.ecartJours("2026-03-16", "2026-03-09"), -7);
    egal(L.ecartJours("2028-01-01", "2029-01-01"), 366);
    egal(L.ecartJours("2026-01-01", "2027-01-01"), 365);
    egal(L.ecartJours("2026-01-01", "n’importe quoi"), null);
  });

  test("estCleValide accepte les vraies dates au bon format", function () {
    verifier(L.estCleValide("2026-11-16"));
    verifier(L.estCleValide("2024-02-29"), "29 février 2024");
    verifier(L.estCleValide("2000-02-29"), "29 février 2000");
    verifier(L.estCleValide("2026-12-31"));
  });

  test("estCleValide refuse les dates impossibles et les mauvais formats", function () {
    var mauvaises = ["2026-02-30", "2026-02-29", "2100-02-29", "2026-13-01", "2026-00-10", "2026-04-31",
      "2026-01-00", "2026-3-1", "26-03-01", "20260301", "2026/03/01", " 2026-03-01", "2026-03-01 ",
      "2026-03-01T12:00:00", "", "abc", "__proto__", "0000-01-01"];
    var autres = [null, undefined, 20260301, {}, [], true, new Date(2026, 2, 1)];
    var i;
    for (i = 0; i < mauvaises.length; i++) {
      egal(L.estCleValide(mauvaises[i]), false, "« " + mauvaises[i] + " »");
    }
    for (i = 0; i < autres.length; i++) {
      egal(L.estCleValide(autres[i]), false, "valeur n° " + i);
    }
  });

  test("grilleMois de février 2028 (bissextile, commence un mardi)", function () {
    var g = L.grilleMois(2028, 2);
    egal(g.length, 5, "nombre de semaines");
    pareil(g[0], [null, "2028-02-01", "2028-02-02", "2028-02-03", "2028-02-04", "2028-02-05", "2028-02-06"]);
    pareil(g[4], ["2028-02-28", "2028-02-29", null, null, null, null, null]);
  });

  test("grilleMois de février 2026 (commence un dimanche)", function () {
    var g = L.grilleMois(2026, 2);
    egal(g.length, 5, "nombre de semaines");
    pareil(g[0], [null, null, null, null, null, null, "2026-02-01"]);
    pareil(g[4], ["2026-02-23", "2026-02-24", "2026-02-25", "2026-02-26", "2026-02-27", "2026-02-28", null]);
  });

  test("grilleMois de février 2027 : exactement 4 semaines pleines", function () {
    var g = L.grilleMois(2027, 2);
    egal(g.length, 4, "nombre de semaines");
    egal(g[0][0], "2027-02-01");
    egal(g[3][6], "2027-02-28");
  });

  test("grilleMois de juin 2026 (commence un lundi, 30 jours)", function () {
    var g = L.grilleMois(2026, 6);
    egal(g.length, 5, "nombre de semaines");
    egal(g[0][0], "2026-06-01");
    pareil(g[4], ["2026-06-29", "2026-06-30", null, null, null, null, null]);
  });

  test("grilleMois d’août 2026 : 6 semaines (31 jours, commence un samedi)", function () {
    var g = L.grilleMois(2026, 8);
    egal(g.length, 6, "nombre de semaines");
    pareil(g[0], [null, null, null, null, null, "2026-08-01", "2026-08-02"]);
    pareil(g[5], ["2026-08-31", null, null, null, null, null, null]);
  });

  test("grilleMois : chaque mois de 2024 à 2030 est complet et bien aligné", function () {
    var annee, mois, g, s, c, cle, attendu, compte, nonVide;
    for (annee = 2024; annee <= 2030; annee++) {
      for (mois = 1; mois <= 12; mois++) {
        g = L.grilleMois(annee, mois);
        attendu = annee + "-" + (mois < 10 ? "0" : "") + mois + "-01";
        compte = 0;
        for (s = 0; s < g.length; s++) {
          egal(g[s].length, 7, "longueur de semaine en " + annee + "-" + mois);
          nonVide = false;
          for (c = 0; c < 7; c++) {
            cle = g[s][c];
            if (cle !== null) {
              nonVide = true;
              egal(cle, attendu, "ordre des jours");
              egal((L.jourSemaine(cle) + 6) % 7, c, "colonne de " + cle);
              attendu = L.ajouterJours(attendu, 1);
              compte++;
            }
          }
          verifier(nonVide, "semaine entièrement vide en " + annee + "-" + mois);
        }
        egal(compte, new Date(annee, mois, 0).getDate(), "nombre de jours en " + annee + "-" + mois);
      }
    }
  });

  test("grilleMois renvoie [] pour des arguments invalides", function () {
    pareil(L.grilleMois(2026, 0), []);
    pareil(L.grilleMois(2026, 13), []);
    pareil(L.grilleMois(2026, 1.5), []);
    pareil(L.grilleMois("2026", "2"), []);
  });

  test("indexSemaine compte les semaines entières depuis le lundi 1er janvier 2024", function () {
    egal(L.indexSemaine("2024-01-01"), 0);
    egal(L.indexSemaine("2024-01-07"), 0);
    egal(L.indexSemaine("2024-01-08"), 1);
    egal(L.indexSemaine("2023-12-31"), -1);
    egal(L.indexSemaine("2026-11-16"), 150);
    egal(L.indexSemaine("2026-11-22"), 150);
    egal(L.indexSemaine("2026-11-23"), 151);
  });

  test("formaterDate écrit la date en français", function () {
    egal(L.formaterDate("2026-11-16"), "lundi 16 novembre");

  test("stabilité du joker : un jour couvert le reste, et seul le jour qui vient de finir peut le devenir", function () {
    var graine, alea, faits, j, i, k, cle, veille, avant, apres, r, total = 0;
    for (graine = 1; graine <= 8; graine++) {
      alea = L.mulberry32(graine * 15485863);
      faits = [];
      for (i = 0; i < 120; i++) {
        if (alea() < 0.55 + 0.04 * graine) {
          faits.push(L.ajouterJours("2025-12-01", i));
        }
      }
      j = jours(faits);
      avant = [];
      for (i = -2; i < 125; i++) {
        cle = L.ajouterJours("2025-12-01", i);
        veille = L.ajouterJours(cle, -1);
        apres = L.jokersHistorique(j, cle);
        /* L’historique de la veille est un préfixe de celui d’aujourd’hui… */
        pareil(apres.slice(0, avant.length), avant, "graine " + graine + ", un joker a changé de jour vu du " + cle);
        /* … qui ne peut contenir en plus que la veille, tout juste terminée. */
        verifier(apres.length === avant.length || (apres.length === avant.length + 1 && apres[apres.length - 1] === veille),
          "graine " + graine + ", joker posé après coup vu du " + cle + " : " + stable(apres));
        r = L.calculerSerie(j, cle);
        for (k = 0; k < r.jokers.length; k++) {
          verifier(apres.indexOf(r.jokers[k]) !== -1, "joker de la série absent de l’historique : " + r.jokers[k]);
        }
        for (k = 0; k < apres.length; k++) {
          verifier(!Object.prototype.hasOwnProperty.call(j, apres[k]), "jour fait marqué comme joker : " + apres[k]);
          verifier(apres[k] < cle, "aujourd’hui ou un jour futur couvert par un joker : " + apres[k]);
          verifier(k === 0 || L.cleLundi(apres[k]) !== L.cleLundi(apres[k - 1]), "deux jokers la même semaine : " + apres[k]);
        }
        avant = apres;
      }
      total += avant.length;
    }
    verifier(total > 40, "trop peu de jokers pour que le test soit utile : " + total);
  });

  test("calculerSerie, jokersHistorique et meilleureSerie suivent une version de référence écrite avec des clés", function () {
    /* Version naïve, au plus près de la règle : on avance de clé en clé, du
       plus ancien jour fait jusqu’à aujourd’hui. */
    function reference(j, aujourdHui) {
      var fait = Object.prototype.hasOwnProperty.call(j, aujourdHui);
      var resultat = { serie: 0, jokers: [], faitAujourdHui: fait, jokerDispoCetteSemaine: true };
      var historiqueRef = [];
      var meilleure = 0;
      var prises = {};       /* lundis des semaines dont le joker est consommé */
      var vivante = false;
      var cles = Object.keys(j).sort();
      var courant = cles.length > 0 ? cles[0] : null;
      var garde = 0;
      var lundi;
      while (courant !== null && courant <= aujourdHui && garde < 2000) {
        garde++;
        if (Object.prototype.hasOwnProperty.call(j, courant)) {
          vivante = true;
          resultat.serie++;
          meilleure = Math.max(meilleure, resultat.serie);
        } else if (vivante && courant < aujourdHui) {
          lundi = L.cleLundi(courant);
          if (prises[lundi] === true) {
            vivante = false;
            resultat.serie = 0;
            resultat.jokers = [];
          } else {
            prises[lundi] = true;
            resultat.jokers.push(courant);
            historiqueRef.push(courant);
          }
        }
        courant = L.ajouterJours(courant, 1);
      }
      resultat.jokerDispoCetteSemaine = prises[L.cleLundi(aujourdHui)] !== true;
      return { serie: resultat, historique: historiqueRef, meilleure: meilleure };
    }
    var graine, alea, faits, j, i, cle, ref, contexte, avecJoker = 0, rompues = 0;

  /* ================================================================== */
  /* Aides pour les idées, le guide et les schémas                       */
  /* ================================================================== */

  /* Remplace temporairement DDJ.idees, le temps d’une fonction. */
  function avecIdees(idees, fn) {
    var avant = DDJ.idees;
    DDJ.idees = idees;
    try {
      return fn();
    } finally {
      DDJ.idees = avant;
    }
  }

  /* Remplace temporairement DDJ.guide, le temps d’une fonction. */
  function avecGuide(guide, fn) {
    var avant = DDJ.guide;
    DDJ.guide = guide;
    try {
      return fn();
    } finally {
      DDJ.guide = avant;
    }
  }

  /* Aléa déterministe : rend les valeurs de la suite, en boucle, et compte ses appels. */
  function suite(valeurs) {
    var f = function () {
      var v = valeurs[f.appels % valeurs.length];
      f.appels++;
      return v;
    };
    f.appels = 0;
    return f;
  }

  /* Texte JSON écrit avec des apostrophes droites à la place des guillemets. */
  function json(texte) {
    return JSON.parse(texte.replace(/'/g, String.fromCharCode(34)));
  }

  function ideesFactices() {
    return {
      categories: [
        {
          cle: "personnage", nom: "Personnage", description: "Quelqu’un à inventer.", gabarit: "{qui} {quoi} {ou}",

  var IDEE_ROBOT = "Un robot qui fait la sieste dans une gare";

  function chapitreFactice(numero, partie) {
    return {
      id: "g" + (numero < 10 ? "0" : "") + numero,
      numero: numero,
      partie: partie,
      titre: "Chapitre " + numero,

          ]
        },
        { type: "retenir", elements: ["Un.", "Deux.", "Trois."] }
      ]
    };
  }

  /* Quatre chapitres rangés dans le désordre, deux parties dans le désordre. */
  function guideFactice() {
    return {
      parties: [{ numero: 2, titre: "Deuxième partie" }, { numero: 1, titre: "Première partie" }],
      chapitres: [chapitreFactice(3, 2), chapitreFactice(1, 1), chapitreFactice(4, 2), chapitreFactice(2, 1)]
    };
  }

  function idsDe(chapitres) {
    var r = [];
    var i;
    for (i = 0; i < chapitres.length; i++) {
      r.push(chapitres[i].id);
    }
    return r;
  }

  /* Une forme valide par balise, dans un cadre de 320 × 160. */
  function formesValides() {
    return {
      line: ["line", { x1: 10, y1: 10, x2: 100, y2: 80, classe: "trait" }],
      rect: ["rect", { x: 20, y: 20, width: 100, height: 60, rx: 4, ry: 4, classe: "ombre" }],
      circle: ["circle", { cx: 160, cy: 80, r: 40, classe: "accent" }],
      ellipse: ["ellipse", { cx: 160, cy: 80, rx: 60, ry: 20, classe: "leger" }],
      polyline: ["polyline", { points: "10,10 50,40 90,10", classe: "pointille" }],
      polygon: ["polygon", { points: "10,10 50,40 90,10", classe: "plein" }],
      path: ["path", { d: "M10 80 Q 95 10 180 80", classe: "fleche" }],
      text: ["text", { x: 160, y: 150, classe: "etiquette", ancre: "middle" }, "ligne d’horizon"]
    };
  }

  /* Copie d’une forme valide, avec des attributs changés (undefined = retiré). */
  function variante(balise, modifs) {
    var f = formesValides()[balise];
    var nom;
    for (nom in modifs) {
      if (Object.prototype.hasOwnProperty.call(modifs, nom)) {
        if (modifs[nom] === undefined) {
          delete f[1][nom];
        } else {
          f[1][nom] = modifs[nom];
        }
      }
    }
    return f;
  }

  function accepte(forme, contexte) {
    var r = L.validerForme(forme, 320, 160);
    verifier(r && r.ok === true, (contexte || stable(forme)) + " devrait être acceptée : " + (r ? r.erreur : r));
  }

  function refuse(forme, contexte) {
    var r = L.validerForme(forme, 320, 160);
    verifier(r && r.ok === false, (contexte || stable(forme)) + " devrait être refusée");
    verifier(typeof r.erreur === "string" && r.erreur.length > 10, "message d’erreur manquant pour " + (contexte || stable(forme)));
  }

  function schemaFactice() {
    return {
      type: "schema",
      legende: "Un cube posé sur le sol.",
      alt: "Un cube vu de trois quarts, avec une flèche vers la ligne d’horizon.",
      largeur: 320,

      formes: [
        ["rect", { x: 100, y: 50, width: 80, height: 80, classe: "ombre" }],
        ["rect", { x: 100, y: 50, width: 80, height: 80, classe: "trait" }],

  function estTexteReel(v) {
    return typeof v === "string" && v.replace(/\s/g, "") !== "";
  }

  function estListe(v) {
    return Object.prototype.toString.call(v) === "[object Array]";
  }

  var APOSTROPHE_DROITE = String.fromCharCode(39);
  var GUILLEMET_DROIT = String.fromCharCode(34);

  /* Vérifie la typographie d’un texte affiché : ’ et « », jamais ' ni ". */
  function verifierTypographie(texte, ou) {
    verifier(typeof texte === "string", ou + " : ce n’est pas un texte");
    verifier(texte.indexOf(APOSTROPHE_DROITE) === -1, ou + " : apostrophe droite dans « " + texte.slice(0, 60) + " »");
    verifier(texte.indexOf(GUILLEMET_DROIT) === -1, ou + " : guillemet droit dans « " + texte.slice(0, 60) + " »");
    egal(texte, texte.replace(/^\s+|\s+$/g, ""), ou + " : espaces en trop autour du texte");

    }
    return idees;
  }

  function categorieReelle(cle) {
    var liste = ideesReelles().categories;
    var i;
    for (i = 0; i < liste.length; i++) {
      if (liste[i] && liste[i].cle === cle) {
        if (!estListe(liste[i].morceaux) || liste[i].morceaux.length === 0) {
          throw new Error("la catégorie « " + cle + " » n’a pas de morceaux");
        }
        return liste[i];
      }
    }
    throw new Error("la catégorie « " + cle + " » est absente de DDJ.idees");
  }

  /* Champs attendus (en plus de « type ») pour chaque type de bloc. */
  var CHAMPS_BLOCS = {
    texte: ["contenu"], titre: ["contenu"], astuce: ["contenu"], piege: ["contenu"],
    liste: ["elements"], etapes: ["elements"], retenir: ["elements"],

      throw new Error("DDJ.guide.chapitres est absent (donnees/guide-1.js, guide-2.js et guide-3.js manquants ?)");
    }

  function chapitreReel(id) {
    var liste = guideReel().chapitres;
    var i;
    for (i = 0; i < liste.length; i++) {
      if (liste[i] && liste[i].id === id) {
        if (!estListe(liste[i].blocs)) {
          throw new Error("le chapitre " + id + " n’a pas de blocs");
        }
        return liste[i];
      }
    }
    throw new Error("le chapitre " + id + " est absent de DDJ.guide (fichier donnees/guide-*.js manquant ou incomplet ?)");
  }

  function blocsDeType(chapitre, type) {
    var r = [];
    var i;
    for (i = 0; i < chapitre.blocs.length; i++) {
      if (chapitre.blocs[i] && chapitre.blocs[i].type === type) {
        r.push(chapitre.blocs[i]);
      }
    }
    return r;
  }

  /* Schémas d’un chapitre dont la structure est saine (les autres sont signalés par un test à part). */
  function schemasSains(chapitre) {
    var tous = blocsDeType(chapitre, "schema");
    var r = [];
    var i;
    if (tous.length === 0) {
      throw new Error("aucun schéma dans le chapitre " + chapitre.id);
    }
    for (i = 0; i < tous.length; i++) {
      if (L.validerSchema(tous[i]).ok) {
        r.push({ numero: i + 1, bloc: tous[i] });
      }
    }
    return r;
  }

  /* Rectangle occupé par une étiquette non tournée, d’après une largeur moyenne par caractère. */
  function boiteEtiquette(forme, parCaractere) {
    var a = forme[1];
    var largeur = forme[2].length * parCaractere;
    var gauche = a.ancre === "middle" ? a.x - largeur / 2 : (a.ancre === "end" ? a.x - largeur : a.x);
    return { gauche: gauche, droite: gauche + largeur, haut: a.y - 9, bas: a.y + 2 };
  }

  /* Tous les textes affichés d’un chapitre, avec leur emplacement. */
  function textesAffiches(chapitre) {
    var r = [];
    var i, k, b, ou;
    function ajouter(texte, lieu) {
      r.push({ texte: texte, ou: lieu });
    }
    function ajouterListe(liste, lieu) {
      var n;
      if (estListe(liste)) {
        for (n = 0; n < liste.length; n++) {
          ajouter(liste[n], lieu + " (élément " + (n + 1) + ")");
        }
      }
    }
    ajouter(chapitre.titre, "titre du chapitre");
    ajouter(chapitre.resume, "résumé du chapitre");
    for (i = 0; i < chapitre.blocs.length; i++) {
      b = chapitre.blocs[i];
      if (!b || typeof b !== "object") {
        continue;
      }
      ou = "bloc " + (i + 1) + " (" + b.type + ")";
      if (b.type === "liste" || b.type === "etapes" || b.type === "retenir") {
        ajouterListe(b.elements, ou);
      } else if (b.type === "exercice") {
        ajouter(b.titre, ou + ", titre");
        ajouter(b.consigne, ou + ", consigne");
        ajouter(b.materiel, ou + ", matériel");
        ajouterListe(b.etapes, ou + ", étapes");
      } else if (b.type === "schema") {
        ajouter(b.legende, ou + ", légende");
        ajouter(b.alt, ou + ", alt");
        if (estListe(b.formes)) {
          for (k = 0; k < b.formes.length; k++) {
            if (estListe(b.formes[k]) && b.formes[k][0] === "text") {
              ajouter(b.formes[k][2], ou + ", étiquette de la forme " + (k + 1));
            }
          }
        }
      } else {
        ajouter(b.contenu, ou);
      }
    }
    return r;
  }

        verifier(c.blocs.length >= 6, "seulement " + c.blocs.length + " blocs (au moins des explications, 3 schémas, un exercice et les points à retenir)");
      });

      test(nomTest + " : blocs de types permis, chacun avec ses champs et rien d’autre", function () {
        var c = chapitreReel(id);
        var k, n, b, champs, ou;
        for (k = 0; k < c.blocs.length; k++) {
          b = c.blocs[k];
          ou = "bloc " + (k + 1);
          verifier(b && typeof b === "object" && !estListe(b), ou + " : ce n’est pas un objet");
          verifier(typeof b.type === "string" && Object.prototype.hasOwnProperty.call(CHAMPS_BLOCS, b.type),
            ou + " : type non permis " + stable(b.type));
          ou += " (" + b.type + ")";
          champs = CHAMPS_BLOCS[b.type].concat(["type"]).sort();
          pareil(Object.keys(b).sort(), champs, ou + " : champs");
          if (b.type === "texte" || b.type === "titre" || b.type === "astuce" || b.type === "piege") {
            verifier(estTexteReel(b.contenu), ou + " : contenu vide");
          }
          if (b.type === "liste" || b.type === "etapes" || b.type === "retenir") {
            verifier(estListe(b.elements) && b.elements.length >= 1, ou + " : au moins un élément attendu");
            for (n = 0; n < b.elements.length; n++) {
              verifier(estTexteReel(b.elements[n]), ou + " : élément " + (n + 1) + " vide");
            }
          }
        }
        verifier(blocsDeType(c, "texte").length >= 1, "aucun paragraphe d’explication");
      });

      test(nomTest + " : exactement un exercice, après les explications, 3 étapes « N min : » dont la somme égale la durée", function () {
        var c = chapitreReel(id);
        var exercices = blocsDeType(c, "exercice");
        var position = -1;
        var somme = 0;
        var e, k, m;
        egal(exercices.length, 1, "nombre de blocs exercice");
        e = exercices[0];
        verifier(estTexteReel(e.titre), "titre de l’exercice manquant");
        verifier(estTexteReel(e.consigne), "consigne manquante");
        verifier(estTexteReel(e.materiel), "matériel manquant");
        verifier(estListe(e.etapes), "etapes n’est pas un tableau");
        egal(e.etapes.length, 3, "nombre d’étapes");
        for (k = 0; k < 3; k++) {
          m = /^(\d+) min : \S/.exec(String(e.etapes[k]));
          verifier(m !== null, "l’étape " + (k + 1) + " ne commence pas par « N min : » (« " + String(e.etapes[k]).slice(0, 30) + " »)");
          verifier(parseInt(m[1], 10) >= 1, "étape " + (k + 1) + " de 0 minute");
          somme += parseInt(m[1], 10);
        }
        verifier(e.duree === 10 || e.duree === 15 || e.duree === 20 || e.duree === 30, "durée " + stable(e.duree) + " (10, 15, 20 ou 30 attendu)");
        egal(somme, e.duree, "somme des temps des étapes");
        for (k = 0; k < c.blocs.length; k++) {
          if (c.blocs[k] === e) {
            position = k;
          }
        }
        verifier(position >= 1, "l’exercice ouvre le chapitre : il doit venir après les explications");
        for (k = position + 1; k < c.blocs.length; k++) {
          verifier(c.blocs[k].type === "retenir" || c.blocs[k].type === "astuce" || c.blocs[k].type === "piege",
            "un bloc « " + c.blocs[k].type + " » suit l’exercice : les explications doivent venir avant");
        }
      });

      test(nomTest + " : un seul bloc « retenir », en dernier", function () {
        var c = chapitreReel(id);
        var retenir = blocsDeType(c, "retenir");
        egal(retenir.length, 1, "nombre de blocs retenir");
        egal(c.blocs[c.blocs.length - 1].type, "retenir", "type du dernier bloc");
        verifier(estListe(retenir[0].elements) && retenir[0].elements.length >= 2,
          "au moins 2 points à retenir attendus");
      });

      test(nomTest + " : 3 ou 4 schémas, tous acceptés par validerSchema", function () {
        var c = chapitreReel(id);
        var schemas = blocsDeType(c, "schema");
        var k, r;
        verifier(schemas.length === 3 || schemas.length === 4, schemas.length + " schémas (3 ou 4 attendus)");
        for (k = 0; k < schemas.length; k++) {
          r = L.validerSchema(schemas[k]);
          verifier(r.ok === true, "schéma " + (k + 1) + " (« " + String(schemas[k].legende).slice(0, 40) + " ») refusé : " + r.erreur);
        }
      });

      test(nomTest + " : schémas, étiquettes de 25 caractères au plus", function () {
        var c = chapitreReel(id);
        var schemas = blocsDeType(c, "schema");
        var k, n, f;
        verifier(schemas.length > 0, "aucun schéma");
        for (k = 0; k < schemas.length; k++) {
          verifier(estListe(schemas[k].formes), "schéma " + (k + 1) + " : formes absentes");
          for (n = 0; n < schemas[k].formes.length; n++) {
            f = schemas[k].formes[n];
            if (estListe(f) && f[0] === "text") {
              verifier(typeof f[2] === "string" && f[2].length <= 25,
                "schéma " + (k + 1) + ", forme " + (n + 1) + " : étiquette de " + String(f[2]).length + " caractères (« " + f[2] + " »)");
              egal(f[2], String(f[2]).replace(/^\s+|\s+$/g, ""), "schéma " + (k + 1) + ", forme " + (n + 1) + " : espaces autour de l’étiquette");
            }
          }
        }
      });

      test(nomTest + " : schémas, tout tient dans le cadre avec une marge de 6", function () {
        var c = chapitreReel(id);
        var schemas = schemasSains(c);
        var soucis = [];
        var k, n, r;
        for (k = 0; k < schemas.length; k++) {
          for (n = 0; n < schemas[k].bloc.formes.length; n++) {
            r = L.validerForme(schemas[k].bloc.formes[n], 320, schemas[k].bloc.hauteur, L.SCHEMA_MARGE);
            if (!r.ok) {
              soucis.push("schéma " + schemas[k].numero + ", forme " + (n + 1) + " : " + r.erreur);
            }
          }
        }
        verifier(soucis.length === 0, soucis.length + " forme(s) trop près du bord. " + soucis.slice(0, 6).join(" | "));
      });

      test(nomTest + " : schémas, étiquettes entières dans le cadre (estimation : 6 de large par caractère)", function () {
        var c = chapitreReel(id);
        var schemas = schemasSains(c);
        var soucis = [];
        var k, n, f, b;
        for (k = 0; k < schemas.length; k++) {
          for (n = 0; n < schemas[k].bloc.formes.length; n++) {
            f = schemas[k].bloc.formes[n];
            if (f[0] === "text" && f[1].transform === undefined) {
              b = boiteEtiquette(f, 6);
              if (b.gauche < 0 || b.droite > 320 || b.haut < 0 || b.bas > schemas[k].bloc.hauteur) {
                soucis.push("schéma " + schemas[k].numero + ", forme " + (n + 1) + " : « " + f[2] + " » irait de x = " +
                  Math.round(b.gauche) + " à " + Math.round(b.droite) + ", de y = " + Math.round(b.haut) + " à " + Math.round(b.bas));
              }
            }
          }
        }
        verifier(soucis.length === 0, soucis.length + " étiquette(s) coupée(s) par le bord. " + soucis.slice(0, 6).join(" | "));
      });

      test(nomTest + " : schémas, étiquettes qui ne se chevauchent pas (estimation : 5,5 de large par caractère)", function () {
        var c = chapitreReel(id);
        var schemas = schemasSains(c);
        var soucis = [];
        var k, n, p, f, boites, a, b;
        for (k = 0; k < schemas.length; k++) {
          boites = [];
          for (n = 0; n < schemas[k].bloc.formes.length; n++) {
            f = schemas[k].bloc.formes[n];
            if (f[0] === "text" && f[1].transform === undefined) {
              b = boiteEtiquette(f, 5.5);
              b.texte = f[2];
              boites.push(b);
            }
          }
          for (n = 0; n < boites.length; n++) {
            for (p = n + 1; p < boites.length; p++) {
              a = boites[n];
              b = boites[p];
              /* Chevauchement net : plus de 3 en largeur et plus de 3 en hauteur. */
              if (Math.min(a.droite, b.droite) - Math.max(a.gauche, b.gauche) > 3 &&
                  Math.min(a.bas, b.bas) - Math.max(a.haut, b.haut) > 3) {
                soucis.push("schéma " + schemas[k].numero + " : « " + a.texte + " » et « " + b.texte + " »");
              }
            }
          }
        }
        verifier(soucis.length === 0, soucis.length + " paire(s) d’étiquettes superposées. " + soucis.slice(0, 6).join(" | "));
      });

      test(nomTest + " : textes en bon français typographique (’ et « », jamais d’apostrophe ni de guillemet droits)", function () {
        var c = chapitreReel(id);
        var textes = textesAffiches(c);
        var k;
        verifier(textes.length > 10, "trop peu de textes trouvés : " + textes.length);
        for (k = 0; k < textes.length; k++) {
          verifierTypographie(textes[k].texte, textes[k].ou);
        }
      });
    }
    for (i = 0; i < IDS_CHAPITRES.length; i++) {
      testsChapitre(IDS_CHAPITRES[i]);
    }
  })();

  /* ================================================================== */
  /* Bilan et affichage                                                  */
  /* ================================================================== */

  var echecs = [];
  var reussis = 0;
  (function () {
    var i;
    for (i = 0; i < resultats.length; i++) {
      if (resultats[i].ok) {
        reussis++;
      } else {
        echecs.push({ nom: resultats[i].groupe + " › " + resultats[i].nom, message: resultats[i].message });
      }
    }
  })();

  window.__tests = { total: resultats.length, reussis: reussis, echecs: echecs };

  if (typeof document !== "undefined" && document && typeof document.createElement === "function") {
    (function () {
      var zone = document.getElementById("resultats");
      var bilan = document.getElementById("bilan");
      var groupeAffiche = null;
      var liste = null;
      var titre, compteur, i, r, li, message, okGroupe, totalGroupe, k;

      for (i = 0; i < resultats.length; i++) {
        r = resultats[i];
        if (r.groupe !== groupeAffiche) {
          groupeAffiche = r.groupe;
          okGroupe = 0;
          totalGroupe = 0;
          for (k = 0; k < resultats.length; k++) {
            if (resultats[k].groupe === groupeAffiche) {
              totalGroupe++;
              if (resultats[k].ok) {
                okGroupe++;
              }
            }
          }
          titre = document.createElement("h2");
          titre.appendChild(document.createTextNode(groupeAffiche + " "));
          compteur = document.createElement("small");
          compteur.appendChild(document.createTextNode("(" + okGroupe + "/" + totalGroupe + ")"));
          titre.appendChild(compteur);
          zone.appendChild(titre);
          liste = document.createElement("ul");
          zone.appendChild(liste);
        }
        li = document.createElement("li");
        li.className = r.ok ? "ok" : "echec";
        li.appendChild(document.createTextNode((r.ok ? "✓ " : "✗ ") + r.nom));
        if (!r.ok) {
          message = document.createElement("span");
          message.className = "message";
          message.appendChild(document.createTextNode(r.message));
          li.appendChild(message);
        }
        liste.appendChild(li);
      }

      if (echecs.length === 0) {
        bilan.className = "bilan ok";
        bilan.textContent = "✓ " + reussis + "/" + resultats.length + " tests réussis";
        document.title = "Tests : " + reussis + "/" + resultats.length + " OK";
      } else {
        bilan.className = "bilan echec";
        bilan.textContent = "✗ " + echecs.length + " échec" + (echecs.length > 1 ? "s" : "") + " sur " + resultats.length +
          " tests (" + reussis + " réussis)";
        document.title = "Tests : " + echecs.length + " ÉCHECS";
      }
    })();
  }
})();
</script>
</body>
</html>
